# AutoTC CI
# - main 푸시 / PR: 단위 테스트 · 비밀값 평문 검사만 (예시 사이트 saucedemo는 자동으로 돌리지 않음)
# - 수동 실행(Actions 탭): 태그·플랫폼을 지정해 PC 웹·MW·API 자동화 실행 → 요약·JUnit·증적 업로드
# 자동화 실행은 종료 기준(data/config.json의 exitCriteria)을 못 맞추면 실패합니다.
# 슬랙 알림은 저장소 Secrets에 AUTOTC_SLACK_WEBHOOK을 넣으면 켜집니다.
# 비밀값({"secret": "NAME"})은 저장소 Secrets에 같은 이름으로 넣고 아래 AutoTC 실행 env에 추가합니다.
# 화면 비교(@visual)는 OS별 기준 이미지가 필요해 CI에서는 리눅스 기준 이미지를 커밋한 뒤에 켭니다.
name: AutoTC

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      tags:
        description: '실행할 태그 (쉼표로 구분, 비우면 전체)'
        required: false
        default: 'smoke'
      platforms:
        description: '플랫폼 (pc, mw, api)'
        required: false
        default: 'pc,mw,api'

concurrency:
  group: autotc-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit:
    name: 단위 테스트
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: 비밀값 평문 검사
        run: npm run scan:secrets

  e2e:
    name: 자동화 실행
    needs: unit
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Chromium 설치
        run: npx playwright install --with-deps chromium

      - name: 실행 대상 결정
        id: suite
        env:
          INPUT_TAGS: ${{ inputs.tags }}
          INPUT_PLATFORMS: ${{ inputs.platforms }}
        run: |
          tags="$INPUT_TAGS"; platforms="${INPUT_PLATFORMS:-pc,mw,api}"; label="수동 실행 ${GITHUB_SHA::7}"
          {
            echo "tags=$tags"
            echo "platforms=$platforms"
            echo "label=$label"
          } >> "$GITHUB_OUTPUT"

      - name: AutoTC 실행
        env:
          TAGS: ${{ steps.suite.outputs.tags }}
          PLATFORMS: ${{ steps.suite.outputs.platforms }}
          LABEL: ${{ steps.suite.outputs.label }}
          AUTOTC_SLACK_WEBHOOK: ${{ secrets.AUTOTC_SLACK_WEBHOOK }}
          SAUCE_PASSWORD: ${{ secrets.SAUCE_PASSWORD }}
        run: |
          args=(--platforms "$PLATFORMS" --exclude-tags demo-bug,visual --label "$LABEL" --out autotc-report)
          if [ -n "$TAGS" ]; then args+=(--tags "$TAGS"); fi
          npm run ci -- "${args[@]}"

      - name: 리포트·증적 업로드
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: autotc-${{ github.run_number }}
          path: |
            autotc-report/
            data/state/
          retention-days: 14
          if-no-files-found: ignore
